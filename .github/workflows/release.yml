# Automated release packaging.
#
# Triggered automatically when a version tag is pushed (v*), or manually from
# the Actions tab ("Run workflow", optionally pass a tag). It:
#   1. configures + builds all targets (Release, x64, MSVC)
#   2. runs the unit tests (ctest)
#   3. packages the header-only library + docs + demo executables + recordings
#      into dist/ekit-<version>-win64.zip
#   4. extracts the current version's section from CHANGELOG.md
#   5. creates (or updates) a GitHub Release with the zip + boids GIFs attached

name: Release (automated packaging)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.1.0); empty = latest tag'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version
        id: ver
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "push") {
            $v = "${{ github.ref_name }}"
          } elseif ("${{ inputs.tag }}" -ne "") {
            $v = "${{ inputs.tag }}"
          } else {
            $v = git describe --tags --abbrev=0
            if (-not $v) { $v = "v0.1.0" }
          }
          $v = $v.TrimStart('v')
          Add-Content -Path $env:GITHUB_OUTPUT -Value "version=$v"

      - name: Configure
        # Do not hardcode a generator: let CMake pick the installed Visual
        # Studio (VS 2022 on GitHub windows-latest, newest VS locally).
        run: cmake -S . -B build -A x64 -DEKIT_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package
        shell: pwsh
        run: |
          $ver = "${{ steps.ver.outputs.version }}"
          New-Item -ItemType Directory -Force -Path pkg, dist | Out-Null
          Copy-Item -Path include\ekit -Destination "pkg\ekit" -Recurse -Force
          Copy-Item README.md, README.zh-CN.md, LICENSE, CHANGELOG.md -Destination pkg -Force
          # demo executables (live viewer needs GLFW, not packaged)
          Copy-Item build\Release\ekit_basic.exe, build\Release\ekit_boids.exe, build\Release\ekit_boids_bench.exe -Destination pkg -Force -ErrorAction SilentlyContinue
          # 10k-boid recordings
          Copy-Item examples\boids\boids_t*.gif -Destination pkg -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path "pkg\*" -DestinationPath "dist\ekit-$ver-win64.zip" -Force
          Get-ChildItem dist | Select-Object Name, Length

      - name: Release notes (from CHANGELOG.md)
        shell: pwsh
        run: |
          $ver = "${{ steps.ver.outputs.version }}"
          $lines = Get-Content CHANGELOG.md
          $start = ($lines | Select-String -SimpleMatch "## [$ver]").LineNumber
          $end = ($lines | Select-String -Pattern '^## ' | Where-Object { $_.LineNumber -gt $start } | Select-Object -First 1).LineNumber
          if ($start) {
            if ($end) { $body = $lines[($start-1)..($end-2)] -join "`n" }
            else { $body = $lines[($start-1)..($lines.Count-1)] -join "`n" }
          } else {
            $body = "Release $ver"
          }
          Set-Content -Path RELEASE_NOTES.md -Value $body -Encoding utf8

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: ekit v${{ steps.ver.outputs.version }}
          body_path: RELEASE_NOTES.md
          files: |
            dist/ekit-${{ steps.ver.outputs.version }}-win64.zip
            examples/boids/boids_t1.gif
            examples/boids/boids_t2.gif
            examples/boids/boids_t3.gif
            examples/boids/boids_t4.gif
          fail_on_unmatched_files: true